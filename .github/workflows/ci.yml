name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test (unit + A2A in-process)
        run: uv run pytest -q
      # Ngày 11: thêm job eval-smoke (20 hoá đơn, replay cassette, không tốn tiền LLM)
