# Infra cho AP Copilot. Ngày 1 chỉ cần Postgres (pgvector); các agent sẽ được thêm dần.
# Port host 5435 để không đụng Postgres 5434 của iVA nếu chạy song song.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ap
      POSTGRES_PASSWORD: ap
      POSTGRES_DB: ap_copilot
    ports:
      - "127.0.0.1:5435:5432"   # chỉ bind localhost (bài học từ staging iVA: Docker vượt qua ufw)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ap -d ap_copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # echo:
  #   build: .
  #   command: uv run python -m agents.echo
  #   environment: { ECHO_HOST: 0.0.0.0, ECHO_PUBLIC_URL: http://echo:9100 }
  #   ports: ["127.0.0.1:9100:9100"]
  # (Ngày 7 sẽ đóng gói toàn bộ agent bằng Dockerfile)

volumes:
  pgdata:
